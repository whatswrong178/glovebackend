# ──────────────────────────────────────────────────────────────────────────────
# MediGlove ERP — CI Sentinel (T-01.5)
#
# Triggers on every push and pull-request to main/dev.
# BLOCKS Vercel deployment if any financial unit test fails.
#
# Gate order:
#   1. Type-check (tsc --noEmit)
#   2. Run Vitest with coverage
#   3. Assert 100% coverage on commission engine
#   4. (Implicit) Vercel only deploys when this workflow passes
# ──────────────────────────────────────────────────────────────────────────────
name: CI Sentinel

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  NODE_VERSION: "20"

jobs:
  # ── Job 1: Type Check ───────────────────────────────────────────────────────
  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type-check
        run: npm run lint

  # ── Job 2: Financial Unit Tests ─────────────────────────────────────────────
  financial-tests:
    name: Financial Unit Tests (100% Coverage Gate)
    runs-on: ubuntu-latest
    needs: typecheck

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest with coverage
        run: npm run test:coverage
        env:
          # Tests run in Node — no Supabase connection needed
          # (All financial functions are pure, no DB calls)
          CI: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # ── Job 3: Build Check ──────────────────────────────────────────────────────
  build:
    name: Vite Production Build
    runs-on: ubuntu-latest
    needs: financial-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          # Provide dummy env vars so Vite doesn't crash on missing vars
          VITE_SUPABASE_URL:      "https://placeholder.supabase.co"
          VITE_SUPABASE_ANON_KEY: "placeholder-anon-key-for-ci"

      - name: Check bundle sizes
        run: |
          echo "=== Bundle sizes ==="
          du -sh dist/assets/*.js 2>/dev/null | sort -h || echo "No JS chunks found"
          echo "Build succeeded ✅"
